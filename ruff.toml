# Конфигурация линтера ruff — общая для локальных прогонов и CI (.github/workflows/tests.yml).
# Задача: ловить реальные ошибки (необъявленные имена, битые импорты), а не спорить о стиле.

line-length = 120
target-version = "py311"
exclude = [".venv", "node_modules", "web/site", "dist", "_archive", "_trash_marvin", "data"]

[lint]
# Ловим реальные ошибки (необъявленные имена, битые/лишние импорты, недостижимый код),
# а не спорим о стиле: в проекте местами намеренно плотная запись в одну строку.
select = ["F", "E9", "W6"]
ignore = []

[lint.per-file-ignores]
"tests/*" = ["F401", "F811", "F841"]
"core/tools/registry.py" = ["F401"]
