# Запуск на Linux / Mac / VPS:   docker compose up -d
# Затем откройте http://localhost:8765 — при первом запуске появится мастер настройки.
#
# Ollama (локальная модель) поднимается вторым контейнером. Если видеокарты нет —
# в мастере выберите режим «только облако», контейнер ollama можно удалить из этого файла.
services:
  assistant:
    build: .
    container_name: assistant
    restart: unless-stopped
    # ⚠ Порт публикуется на 0.0.0.0 — ядро слушает всю сеть, чтобы сайт открывался с телефона.
    # Снаружи (с чужого устройства) без ключа из ⚙ Настроек → «с телефона» ничего не отдаётся:
    # см. core/api/auth.py (AuthMiddleware). Если порт пробрасывается наружу (роутер/VPS),
    # дополнительно ограничьте его правилами файрвола — ключ хранится на ПК и в QR-ссылке.
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data              # база, бэкапы, картинки — всё здесь
      - ./config.yaml:/app/config.yaml # перед первым запуском: cp config.example.yaml config.yaml
    environment:
      - TZ=Europe/Moscow
      - OLLAMA_URL=http://ollama:11434
    # Минимальные права: процесс не может повысить привилегии (никаких setuid внутри).
    security_opt:
      - no-new-privileges:true
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Для NVIDIA раскомментируйте (нужен nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama:
