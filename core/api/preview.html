<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #dfe7ff 0%, #f5f5f7 55%) fixed; color: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) {
    body { background: radial-gradient(1200px 600px at 50% -10%, #1b2440 0%, #000 60%) fixed; color: #f5f5f7; }
    .card { background: rgba(28,28,30,.72) !important; border-color: rgba(255,255,255,.08) !important; }
    .msg.bot { background: #2c2c2e !important; }
    input { background: #1c1c1e !important; color: #fff; border-color: rgba(255,255,255,.12) !important; }
    .chip { background: rgba(255,255,255,.08) !important; }
  }
  .card {
    width: min(680px, 94vw); background: rgba(255,255,255,.72); backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(0,0,0,.06); border-radius: 28px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,.08);
  }
  h1 { font-size: 34px; letter-spacing: -.03em; margin: 0 0 4px; font-weight: 700; }
  .sub { opacity: .6; font-size: 15px; margin-bottom: 20px; }
  .status { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .chip { font-size: 13px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.05); display: flex; gap: 6px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #34c759; }
  .dot.off { background: #ff9f0a; }
  #log { display: flex; flex-direction: column; gap: 10px; max-height: 48vh; overflow: auto; padding: 4px 2px; margin-bottom: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; animation: pop .18s ease-out; }
  .msg.me { align-self: flex-end; background: #0a84ff; color: #fff; border-bottom-right-radius: 6px; }
  .msg.bot { align-self: flex-start; background: #e9e9eb; border-bottom-left-radius: 6px; }
  .via { font-size: 11px; opacity: .45; margin-top: 4px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; font: inherit; font-size: 16px; padding: 12px 16px; border-radius: 999px; border: 1px solid rgba(0,0,0,.1); outline: none; }
  input:focus { border-color: #0a84ff; box-shadow: 0 0 0 4px rgba(10,132,255,.15); }
  button { font: inherit; font-weight: 600; padding: 12px 20px; border-radius: 999px; border: 0; background: #0a84ff; color: #fff; cursor: pointer; }
  button:active { transform: scale(.97); }
  .hints { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .hints span { font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(128,128,128,.25); cursor: pointer; opacity: .8; }
  .hints span:hover { opacity: 1; border-color: #0a84ff; }
  @keyframes pop { from { transform: translateY(4px); opacity: 0; } }
</style>
</head>
<body>
<div class="card">
  <h1>J.A.R.V.I.S.</h1>
  <div class="sub">Этап 1 · ядро онлайн. Полноценный интерфейс — на этапе 2. Это тестовый чат с мозгом.</div>
  <div class="status" id="status"></div>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="Напиши как в Telegram: «потратил 700 на такси»" autocomplete="off" autofocus>
    <button>Отправить</button>
  </form>
  <div class="hints" id="hints"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const log = $("#log");
const hints = ["что сегодня","потратил 700 на такси","встреча в среду в 15:00 с Димой","надо купить молоко","долг Сберу 120к плачу 8к 25-го","финансы","долги","мысль: идея для проекта","отмени последнюю"];
$("#hints").innerHTML = hints.map(h => `<span onclick="send('${h.replace(/'/g,"\\'")}')">${h}</span>`).join("");
function add(text, cls, via) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  if (via) { const v = document.createElement("div"); v.className = "via"; v.textContent = {rules:"⚡ правила · без LLM", ollama:"🧠 локальная LLM", gemini:"☁️ Gemini (обезличено)", none:"⚠️ LLM недоступна"}[via] || via; d.appendChild(v); }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
async function send(text) {
  text = (text || $("#q").value).trim(); if (!text) return;
  $("#q").value = ""; add(text, "me");
  try {
    const r = await fetch("/api/chat", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({text, channel:"web"})});
    const j = await r.json(); add(j.text, "bot", j.via);
  } catch (e) { add("Ядро не отвечает: " + e, "bot"); }
}
$("#f").addEventListener("submit", e => { e.preventDefault(); send(); });
fetch("/api/health").then(r => r.json()).then(h => {
  $("#status").innerHTML =
    `<div class="chip"><i class="dot"></i>API</div>` +
    `<div class="chip"><i class="dot ${h.ollama ? "" : "off"}"></i>Ollama ${h.ollama ? "онлайн" : "не запущена (работают правила)"}</div>` +
    `<div class="chip">режим: ${h.mode}</div>`;
});
add("Система онлайн, сэр. Проверьте меня — напишите что-нибудь или ткните в подсказку ниже.", "bot");
</script>
</body>
</html>
