# ==========================================================
#  Файл настроек ассистента.
#  Обычно его НЕ нужно править руками: при первом запуске откроется мастер в браузере
#  (http://localhost:8765/setup), а дальше всё меняется в ⚙ Настройках на сайте.
#  Строки с "#" — подсказки.
# ==========================================================

assistant:
  name: "Марвин"              # имя ассистента: так он представляется и на это слово откликается голосом (2–3 слога, по-русски)
  name_latin: "marvin"        # латиницей — для заголовков окон и логов
  aliases: ""                 # другие варианты имени через запятую, например "марв, marvin"

owner:
  name: "Сэр"                 # как ассистент к вам обращается («сэр», «босс», ваше имя)
  timezone: "Europe/Moscow"

telegram:
  token: ""                   # токен бота от @BotFather (заполняется мастером)
  owner_id: 0                 # ваш Telegram ID (мастер определит сам по команде /start)
  # Адрес сайта для кнопки-приложения в Telegram (Mini App). Появляется после «funnel.bat»:
  # публичный адрес вида "https://имя-пк.имя-сети.ts.net". Пусто = кнопки в боте нет. См. docs/telegram-miniapp.md
  webapp_url: ""
  morning_digest: "08:30"     # утренний дайджест ЧЧ:ММ; пусто — выключить
  proxy: ""                   # если api.telegram.org недоступен: "socks5://логин:пароль@хост:1080" или "http://хост:8080"

notifications:
  quiet_from: 23              # тихие часы: с этого часа ассистент сам ничего не пишет (бюджет, подписки, вечерний обзор)…
  quiet_to: 8                 # …и до этого. Напоминания о встречах и дедлайнах, которые вы поставили сами, приходят всегда
  proactive_enabled: true     # сам пишет о том, что заметил: клиент тянет с оплатой, дело без срока висит, «как самочувствие?».
  proactive_per_day: 5        # …но не больше стольких раз в день и не в тихие часы. Кнопка «не надо про это» — тема больше не всплывает

brain:
  # Режим мозга (выбирается мастером):
  #   local  — только Ollama на вашем ПК. Ничего не уходит в интернет.
  #   hybrid — Ollama для личного (деньги, календарь, заметки) + облако для общих вопросов. Личное обезличивается.
  #   cloud  — только облако (без видеокарты). Все данные уходят к провайдеру — честно предупреждаем.
  mode: "hybrid"
  ollama:
    url: "http://127.0.0.1:11434"
    model: ""                 # модель Ollama; мастер подберёт под видеокарту (например qwen3.5:4b / qwen3.5:9b / gemma4:e4b)
    embed_model: "nomic-embed-text"   # смысловой поиск по мозгу (ollama pull nomic-embed-text)
    vision_model: ""          # отдельная модель зрения; пусто — если основная сама видит картинки (qwen3.5, gemma4)
    keep_alive: "2h"          # держать модель в видеопамяти после ответа (0 — выгружать сразу)
    small_model: ""           # малая модель для мини-задач (судья «трата/заказ/долг?», проактивные фразы): "qwen2.5:1.5b"
                              # (ollama pull qwen2.5:1.5b, ~1 ГБ). Пусто — мини-задачи идут на основную модель
    small_keep_alive: "5m"    # малая живёт в видеопамяти 5 минут после задачи и выгружается сама — играм и рендеру не мешает. 0 — сразу
    num_ctx: 8192             # окно контекста. 4096 мало: промпт + инструменты + история ≈ 5k токенов. На 6 ГБ видеокарте 8192 с моделью 4b влезает
  vision:
    where: "auto"             # auto — ПК, при сбое облако | cloud — всегда облако | local — только ПК
    allow_cloud: true
  # Сообщение-список («на сегодня: …, клиент …, заказ …, должен …») разбирается на записи одним махом.
  sorter:
    where: "cloud"            # cloud — облако (надёжнее на длинных смешанных списках; весь текст уходит целиком) | local — только ПК | auto — ПК, при сбое облако
    confirm: false            # true — сначала показать разбор и ждать «да». false — записывать сразу, «отмени» откатит всю пачку
  memory:
    enabled: true             # память о вас: факты из разговора, портрет, подтягивание нужного в ответы
    where: "cloud"            # кто извлекает и обобщает факты: cloud — облако, при сбое ПК | auto | local. Поиск по памяти — всегда ПК
    short_days: 7             # сколько дней факт живёт в «сейчас», прежде чем стать постоянным или уйти в архив
  judge:
    enabled: true             # судья: спорная фраза без явного глагола («сайт 15000», «отдал Ване 2000», «мама в субботу») — перед записью
                              # нейронка решает, что это (трата / доход / заказ / долг / задача / событие / заметка). Явные команды судью не зовут
    where: "local"            # local — малая или основная модель на ПК (быстро, бесплатно, ничего не уходит) | cloud — облако, при сбое ПК | auto
  relations:
    enabled: true             # связи между записями в Мозге («связано:» под заметкой, смысловые линии в графе)
    where: "cloud"            # кто решает, связаны ли записи: cloud — облако, при сбое ПК | auto — ПК, при сбое облако | local — только ПК
  cloud:
    provider: "groq"          # groq | openrouter | nvidia | deepseek | openai | gemini | custom
    api_key: ""
    model: ""                 # пусто — модель по умолчанию у провайдера
    base_url: ""              # только для custom (LM Studio, vLLM…): http://127.0.0.1:1234/v1
    proxy: ""
    voice_model: ""
  gemini:
    api_key: ""
    model: "auto"
    proxy: ""
    anonymize: true           # вырезать имена/суммы/телефоны перед отправкой в облако (в режиме cloud не действует — там облако видит всё)
    auto: true                # общие вопросы — в облако сами; личное — всегда локально
    mark_source: true         # помечать источник ответа: ⚡ правила / 🧠 локально / ☁️ облако

# Журнал работы: на каждую фразу — строка в базе (путь, модель, инструменты, время, переспросил ли, поправили ли).
# Из него растут «отчёт о себе» в чате, блок в воскресном дайджесте и /api/runs на сайте.
trace:
  enabled: true               # false — не писать ничего (отчёты тогда пустые)
  keep_days: 60               # сколько дней хранить; старше — удаляет ночная уборка в 4:00


persona:
  style: "swag"               # swag — с юмором и «сэр»; neutral — строго по делу
  humor_level: 8              # 0..10

finance:
  currency: "RUB"
  main_account: "Основной"    # название главного счёта (мастер спросит)

files:
  index_dirs: []
  trash_dir: ""               # куда собирать файлы «на удаление» (ассистент сам ничего не удаляет). Пусто — Документы/_на_удаление

voice:
  enabled: true
  stt:
    model: "small"            # whisper: tiny / base / small / medium
    device: "cpu"             # cuda — если поставили gpu.bat
    fast: true
    cloud: false              # распознавать голос через Groq Whisper (быстро, но голос уходит в облако)
  tts:
    engine: "edge"            # edge (онлайн, голоса Microsoft) / silero (офлайн, ставится silero.bat) / off
    speaker: "eugene"
    edge_voice: "ru-RU-DmitryNeural"
    reply_in_telegram: "never"
  pc:
    # api: "http://192.168.1.10:8765"   # если ядро крутится на другой машине (по умолчанию — этот же ПК)
    # api_token: ""                      # тогда же: ключ из data/api_token на той машине
    hotkey: "ctrl+shift+space"
    mic: ""
    silence_sec: 1.5
    max_command_sec: 20
    followup_sec: 6
    conversation_sec: 12
    conversation_mode_sec: 120
    beep: true
    stream: true
    speak_reminders: true
    morning_report: true
    night_from: 23
    night_to: 7
    night_volume: 0.45
    filler_sec: 1.5
    tidy_downloads_days: 0   # ночная уборка «Загрузок»: файлы старше N дней сами едут в Загрузки/Разобрано (журнал, «отмени уборку»). 0 — выключено
    games: []

server:
  host: "0.0.0.0"
  port: 8765

google:
  enabled: false
  client_id: ""
  client_secret: ""
  calendar_id: ""
  proxy: ""

backup:
  enabled: true
  dir: "./data/backups"
  keep_days: 30
  extra_dir: ""
