# ==========================================================
#  J.A.R.V.I.S. — файл настроек
#  Скопируй этот файл как  config.yaml  и заполни поля.
#  Строки, начинающиеся с "#", — это подсказки, их можно не трогать.
# ==========================================================

owner:
  name: "Сэр"                 # как Джарвис к тебе обращается
  timezone: "Europe/Moscow"

telegram:
  token: "ВСТАВЬ_ТОКЕН_ОТ_BOTFATHER"
  # Твой личный Telegram ID (число). Узнать: напиши боту @userinfobot.
  # Бот будет отвечать ТОЛЬКО этому ID, всех остальных игнорирует.
  owner_id: 123456789
  # Утренний дайджест (планы, платежи, задачи). Формат ЧЧ:ММ. Пусто = выключить.
  morning_digest: "08:30"
  # Прокси для Telegram (в РФ api.telegram.org часто заблокирован).
  # Если на ПК включён VPN — оставь пустым. Иначе укажи SOCKS5 или HTTP прокси:
  #   "socks5://логин:пароль@хост:1080"   или   "http://хост:8080"
  proxy: ""
  # Адрес сайта для кнопки-приложения в Telegram (Mini App). Появляется после «funnel.bat»:
  # публичный адрес вида "https://имя-пк.имя-сети.ts.net". Пусто = кнопки в боте нет. См. docs/telegram-miniapp.md
  webapp_url: ""

notifications:
  quiet_from: 23              # тихие часы: с этого часа Джарвис сам ничего не пишет (бюджет, подписки, вечерний обзор)…
  quiet_to: 8                 # …и до этого. Напоминания о встречах и дедлайнах, которые вы поставили сами, приходят всегда
  proactive_enabled: true     # сам пишет о том, что заметил: клиент тянет с оплатой, дело без срока висит, «как самочувствие?».
  proactive_per_day: 5        # …но не больше стольких раз в день и не в тихие часы. Кнопка «не надо про это» — тема больше не всплывает
  proactive_vibe: true        # …и просто написать днём, если поводов по делам нет, а в чате тихо 5+ часов: «как оно?», шутка, наблюдение
                              # (раз в день, 11–20; считается в proactive_per_day). Кнопка «не надо так» выключает
  # 0.10: любое инициативное сообщение проходит через одно решение «сейчас / позже / молча»: тихие часы, лимит в день,
  # вас нет за ПК (пульс voice.bat) → отложить и отдать, когда вернётесь; идёт рендер/игра → позже; только что сели → через 2 мин.
  # Ваши собственные напоминания (встречи, дедлайны) — всегда сразу. Отдельных настроек нет: работает от quiet_* и proactive_per_day.

brain:
  # Режим: "local" (только Ollama), "hybrid" (Ollama + Gemini для общих вопросов), "cloud" (только Gemini)
  mode: "hybrid"
  ollama:
    url: "http://127.0.0.1:11434"
    model: "qwen2.5:7b"       # видеокарта 6 ГБ (GTX 1660 и т.п.) → "qwen3.5:4b" (ollama pull qwen3.5:4b): умнее старой 7b, влезает целиком, видит картинки
    embed_model: "nomic-embed-text"   # для смыслового поиска по Мозгу: ollama pull nomic-embed-text
    vision_model: ""          # зрение (скриншоты, чеки). Если model = qwen3.5 / gemma4 — не нужно, они сами видят. Иначе: ollama pull qwen2.5vl:3b
    keep_alive: "2h"          # сколько держать модель в видеопамяти после ответа (иначе каждый раз грузится 5–15 с). 0 — выгружать сразу
    small_model: ""           # малая модель для мини-задач (судья «трата/заказ/долг?», уборка памяти, проактивные фразы): "qwen2.5:1.5b"
                              # (ollama pull qwen2.5:1.5b, ~1 ГБ). Пусто — мини-задачи идут на основную модель
    small_keep_alive: "5m"    # малая живёт в видеопамяти 5 минут после задачи и выгружается сама — играм и рендеру не мешает. 0 — сразу
    num_ctx: 8192             # окно контекста. 4096 мало: промпт + инструменты + история ≈ 5k токенов. На 6 ГБ видеокарте 8192 с моделью 4b влезает
  # Облако для общих вопросов. Из России без VPN работают openrouter / groq / nvidia (бесплатно) и deepseek (платно, копейки).
  # gemini — работает только через прокси. Ключ берётся на сайте провайдера за минуту, карта не нужна.
  vision:
    where: "auto"             # auto — на ПК, при сбое облако (чеки только ПК) | cloud — всегда облако (быстро; фото и чеки уходят в Groq) | local — только ПК
    allow_cloud: true         # «что на экране» без локальной модели зрения — через облако (Groq). Чеки и документы в облако НЕ уходят никогда
  # Сообщение-список («на сегодня: …, клиент …, заказ …, должен …») разбирается на записи одним махом.
  sorter:
    where: "cloud"            # cloud — облако (надёжнее на длинных смешанных списках; весь текст уходит целиком) | local — только ПК | auto — ПК, при сбое облако
    confirm: false            # true — сначала показать разбор и ждать «да». false — записывать сразу, «отмени» откатит всю пачку
  memory:
    enabled: true             # память о вас: факты из разговора, портрет, подтягивание нужного в ответы
    where: "cloud"            # кто извлекает и обобщает факты: cloud — облако, при сбое ПК | auto | local. Поиск по памяти — всегда ПК
    short_days: 7             # сколько дней факт живёт в «сейчас», прежде чем стать постоянным или уйти в архив
  judge:
    enabled: true             # судья: спорная фраза без явного глагола («сайт 15000», «отдал Ване 2000», «мама в субботу») — перед записью
                              # нейронка решает, что это (трата / доход / заказ / долг / задача / событие / заметка). Явные команды судью не зовут
    where: "local"            # local — малая или основная модель на ПК (быстро, бесплатно, ничего не уходит) | cloud — облако, при сбое ПК | auto
  relations:
    enabled: true             # связи между записями в Мозге («связано:» под заметкой, смысловые линии в графе)
    where: "cloud"            # кто решает, связаны ли записи: cloud — облако, при сбое ПК | auto — ПК, при сбое облако | local — только ПК
  cloud:
    provider: "groq"          # groq | openrouter | nvidia | deepseek | gemini | custom
    api_key: ""               # ключ выбранного провайдера (для gemini — ниже, в gemini.api_key)
    model: ""                 # пусто = модель по умолчанию (groq: openai/gpt-oss-120b, openrouter: лучшая бесплатная автоматически)
    base_url: ""              # только для custom, например http://192.168.1.10:1234/v1
    proxy: ""                 # обычно не нужен
    voice_model: ""           # модель для голосовых ответов (пусто = авто: у groq «compound» заменяется на быструю openai/gpt-oss-20b)
  gemini:
    api_key: ""               # пусто = Gemini выключен
    model: "auto"             # auto = Джарвис сам берёт актуальную flash-модель (Google отключает старые каждые полгода)
    # Из России Google не отвечает напрямую. Прокси: свой (socks5://127.0.0.1:10808) или пусто —
    # тогда возьмётся telegram.proxy. Для socks5 нужен пакет: pip install httpx[socks]
    proxy: ""
    # Анонимайзер: перед отправкой в облако вырезать имена/суммы/телефоны/email
    anonymize: true           # вырезать имена/суммы перед отправкой в облако (в режиме cloud не действует)
    # auto: true  — разговор и общие вопросы («привет», «что такое…», «напиши…») идут в облако сами;
    #               личное (деньги, календарь, задачи, заметки, даты) — ВСЕГДА локально.
    # auto: false — облако только по слову «облако, …»
    auto: true
    # Показывать в ответе, кто ответил: ☁️ Gemini / 🧠 локально
    mark_source: true

# Журнал работы: на каждую фразу — строка в базе (путь, модель, инструменты, время, переспросил ли, поправили ли).
# Из него растут «отчёт о себе» в чате, блок в воскресном дайджесте и /api/runs на сайте.
trace:
  enabled: true               # false — не писать ничего (отчёты тогда пустые)
  keep_days: 60               # сколько дней хранить; старше — удаляет ночная уборка в 4:00

persona:
  display_name: "Джарвис"     # как подписан на сайте и во вкладке (окна и логи остаются J.A.R.V.I.S.)
  # По умолчанию коротко и по делу. "swag" включайте только если действительно нужен юмор.
  style: "neutral"
  humor_level: 2              # 0–2 без шуток · 3–5 мягкая ирония · 6–8 сухой сарказм по конкретике · 9–10 жёстко, без смягчений
  nicknames: ""               # как ещё звать вас, через запятую: "Вовчик, шеф, босс". Пусто — только owner.name
  where: "cloud"              # кто формулирует инициативные фразы и первую строку дайджестов: cloud — облако, при сбое ПК |
                              # auto — ПК (малая модель), при сбое облако | local — только ПК. Без обоих — короткие шаблоны
  voice_accents: false        # true — итог дня и «разнос» по висящему делу иногда приходят голосовым (не чаще раза в день;
                              # нужен /voice ≠ never в Telegram и включённый TTS)

finance:
  currency: "RUB"
  main_account: "Т-Банк"

files:
  # Папки, которые Джарвис индексирует (поиск по файлам). Заполнишь на Этапе 4.
  index_dirs: []
  trash_dir: "C:/Users/%USERNAME%/_Jarvis_на_удаление"

voice:
  # Голосовые сообщения в Telegram (и голос на ПК на следующем этапе). Всё распознаётся локально.
  enabled: true
  stt:
    # Whisper: tiny (быстро, грубо) / base / small (баланс, ~500 МБ) / medium (точно, ~1.5 ГБ, медленно на CPU)
    model: "small"         # для скорости на процессоре: "base" (в 3 раза быстрее small, чуть хуже на шёпоте)
    device: "cpu"          # cuda — NVIDIA-видеокарта, распознавание за 0.3 с вместо 2–3 (нужен gpu.bat)
    fast: true             # быстрый режим (beam 1): в 2–3 раза быстрее, для коротких команд точность та же
    cloud: false           # true — распознавать через Groq Whisper (~1 с даже на слабом ПК), но голос уходит в облако. Нужен провайдер groq
  tts:
    engine: "silero"       # silero (офлайн, скачается 40 МБ) / edge (онлайн, голоса Microsoft) / off
    speaker: "eugene"      # silero: eugene, aidar (муж.), baya, kseniya, xenia (жен.)
    edge_voice: "ru-RU-DmitryNeural"
    reply_in_telegram: "never"   # never — в Telegram только текст (расшифровка + ответ одним сообщением); voice — голосом на голосовые; always — на всё
  pc:
    # Голос на ПК (voice.bat): «Джарвис, …» в микрофон → ответ в наушники. Иконка в трее.
    hotkey: "ctrl+shift+j"   # слушать без wake word
    mic: ""                  # пусто — микрофон по умолчанию; или номер/часть имени из «voice.bat --mics»
    silence_sec: 1.5         # пауза в речи (сек), после которой команда считается сказанной. 0.8 — резво, 2.0 — если обрывает на «ааа…»
    max_command_sec: 20      # дольше этого одну команду не слушает
    followup_sec: 6          # после вопроса Джарвиса столько секунд можно отвечать без «Джарвис»
    conversation_sec: 12     # после ЛЮБОГО ответа столько секунд можно продолжать без «Джарвис» (0 — только после вопросов)
    conversation_mode_sec: 120   # «Джарвис, режим беседы» → окно после каждой реплики; выход — «хватит болтать» / «свободен»
    beep: true               # короткий сигнал «слушаю»
    stream: true             # озвучивать ответ по предложениям, не дожидаясь конца генерации (быстрее в 2–4 раза)
    speak_reminders: true    # напоминания о встречах и задачах произносить вслух («Сэр, через 10 минут созвон»)
    morning_report: true     # первый раз сели за ПК утром (после 6+ часов простоя) — Джарвис сам расскажет план дня
    screen_time:             # экранное время: сколько и где сидите за ПК (карточка на «Сегодня», «сколько сидел за компом», строка в вечернем итоге)
      enabled: false         # пишется только имя программы и сайт/заголовок окна, локально в базу; в облако — никогда. Нужен перезапуск voice.bat
      idle_min: 5            # столько минут без мыши/клавиатуры = «отошёл» (по этому считаются «сел / ушёл»)
      nudges: true           # редкие подколы по факту (YouTube час подряд при дедлайне, игра в рабочее время, 6 ч без перерыва); не чаще раза в 3 ч, в общем лимите
      keep_days: 90          # сколько дней хранить подробности
    night_from: 23           # ночной режим: с 23:00 до 7:00 говорит тише и вслух напоминает только о встречах/дедлайнах
    night_to: 7
    night_volume: 0.45       # громкость ночью (0.1–1.0)
    filler_sec: 1.5          # если мозг думает дольше — скажет «Секунду…», чтобы не было тишины (0 — выключить)
    tidy_downloads_days: 0   # ночная уборка «Загрузок»: файлы старше N дней сами едут в Загрузки/Разобрано (журнал, «отмени уборку»). 0 — выключено
    games: []                # свои игры для авто-игрового режима, имена exe: ["mygame.exe"]. Популярные (CS2, Dota, GTA, Valorant…) знает сам

server:
  host: "0.0.0.0"
  port: 8765

google:
  # Google Календарь: события Джарвиса появляются в Google (телефон, часы, любое приложение).
  # Только в одну сторону: Джарвис → Google. Как получить client_id/secret за 5 минут — README, раздел «Google Календарь».
  enabled: false
  client_id: ""
  client_secret: ""
  calendar_id: ""            # пусто = основной календарь аккаунта
  proxy: ""                  # если Google не открывается напрямую; пусто — возьмёт прокси Telegram

backup:
  enabled: true
  dir: "./data/backups"
  keep_days: 30
  # вторая копия на другой диск или в облачную папку, например "D:/Backups/jarvis" или "C:/Users/Имя/YandexDisk/jarvis"
  extra_dir: ""
