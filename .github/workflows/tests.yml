name: tests

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (линтер Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check core run.py voice_client.py doctor.py setup.py desktop_app.py

  python:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q core run.py voice_client.py setup.py doctor.py desktop_app.py
      - run: python -m pytest tests -q

  web:
    # web/site лежит в репозитории, чтобы пользователю не ставить Node. Здесь проверяем, что его не забыли
    # пересобрать после правок web/src (build_web.bat): сборка должна совпасть с закоммиченной.
    name: web/site up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: fail if web/site differs from the build
        run: |
          if [ -n "$(git status --porcelain -- web/site)" ]; then
            echo "::error::web/site устарел — запустите build_web.bat (или cd web && npm run build) и закоммитьте web/site"
            git status --short -- web/site
            exit 1
          fi

  server:
    # server.ts — второй (Node) стек проекта: его контракты проверяет npm test,
    # типы — tsc, а сборка — vite build.
    name: server.ts (tsc, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
