[pytest]
# F5: устаревший sqlite3 datetime-адаптер скоро удалят (3.15) — любое его
# использование должно падать сразу, а не гнить предупреждениями в логах.
# NB: предупреждения адаптера сейчас приписаны вызывающему модулю
# (sqlalchemy.engine.default), а не sqlite3, — этот фильтр их не ловит;
# ловит только предупреждения, реально поднятые из модуля sqlite3.
filterwarnings =
    error::DeprecationWarning:sqlite3
